name: Verify Package 2 foundations
on:
  push:
    paths:
      - '.github/workflows/review-package2.yml'
      - 'scripts/package2/**'
      - 'assets/**'
      - 'frontend/src/**'
      - 'frontend/scripts/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'Storileaf/storileaf-homepage-preview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published protection, source types, content and shared foundations
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run check && npm run build
      - name: Install isolated browser library and serve exact committed files
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          mkdir -p /tmp/p2-review
          ln -s "$GITHUB_WORKSPACE" /tmp/p2-review/storileaf-homepage-preview
          python3 -m http.server 4173 --directory /tmp/p2-review > /tmp/p2-static.log 2>&1 &
          python3 -m http.server 4180 --directory frontend/dist > /tmp/p2-source.log 2>&1 &
          sleep 2
      - name: Compare typography, spacing, FAQ states and preserved pricing appearance
        run: node scripts/package2/verify.mjs
      - name: Verify actual deployed Pages styling and browser rendering
        run: node scripts/package2/live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package2-published-review
          path: |
            qa/package2/
            qa/package2-live/
          if-no-files-found: warn
