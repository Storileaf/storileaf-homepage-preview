name: Verify React media parity

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/verify-media-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Temporary, tracked public changes only. No Git configuration or credentials.
      - name: Export tracked public changes for interrupted session recovery
        run: git diff --binary d4ffea10af7cce8ebc1f2a9c0c51a6c76d2b3dfd HEAD -- frontend scripts docs .github REPOSITORY_HANDOFF.md > "$RUNNER_TEMP/media-recovery.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: media-tracked-recovery
          path: ${{ runner.temp }}/media-recovery.patch
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and preserve the published runtime
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run check && npm run build
      - name: Install isolated browser harness
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Serve baseline and source
        run: |
          mkdir -p "$RUNNER_TEMP/media-baseline/storileaf-homepage-preview"
          cp -a index.html 404.html assets covers gallery pricing "$RUNNER_TEMP/media-baseline/storileaf-homepage-preview/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/media-baseline" > "$RUNNER_TEMP/media-baseline.log" 2>&1 &
          python3 -m http.server 4180 --bind 127.0.0.1 --directory frontend/dist > "$RUNNER_TEMP/media-source.log" 2>&1 &
          sleep 2
      - name: Run the current media checkpoint
        if: ${{ hashFiles('frontend/scripts/verify-media-parity.mjs') != '' }}
        working-directory: frontend
        run: node scripts/verify-media-parity.mjs
      - name: Confirm protected runtime
        if: always()
        working-directory: frontend
        run: npm run guard:published
      - name: Attach rendered media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-media-parity
          path: frontend/qa/media/
          if-no-files-found: warn
      - name: Attach isolated preview
        uses: actions/upload-artifact@v4
        with:
          name: homepage-media-source-preview
          path: frontend/dist/
          if-no-files-found: error
