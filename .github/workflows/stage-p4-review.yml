name: Stage verified P4 review and durable evidence
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-p4-review.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve the original homepage and tested source identity
        run: |
          node frontend/scripts/guard-published.mjs
          test "$(git rev-parse HEAD:frontend)" = "$(git rev-parse dbfac4a24b1fc16e1d440ac499012a76b27ab0c9:frontend)"
      - name: Inspect all candidate workflows and retain original reports
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto'),assert=require('node:assert/strict');
            const source='dbfac4a24b1fc16e1d440ac499012a76b27ab0c9';
            const out=path.join(process.env.RUNNER_TEMP,'p4-review');fs.mkdirSync(out,{recursive:true});
            const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
            const required=['review-editorial-links.yml','verify-footer-type.yml','validate-public-source.yml','review-package2.yml','verify-p4-reflow.yml','verify-writing-parity.yml','verify-process-parity.yml','verify-group1-parity.yml','verify-hero-parity.yml','verify-assembly-parity.yml','verify-media-parity.yml','verify-group2-parity.yml','verify-shared-parity.yml','verify-discovery-parity.yml'];
            let runs=[];
            for(let i=0;i<108;i++){
              runs=(await github.rest.actions.listWorkflowRunsForRepo({...context.repo,head_sha:source,per_page:100})).data.workflow_runs;
              const tests=runs.filter(r=>required.includes(path.basename(r.path)));
              core.info(JSON.stringify({poll:i,found:tests.length,pending:tests.filter(r=>r.status!=='completed').map(r=>r.name)}));
              if(tests.length===required.length&&tests.every(r=>r.status==='completed'))break;
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            const record={sourceCommit:source,recordedAt:new Date().toISOString(),runs:[],reports:[]};
            const wanted=new Set(['p4-reflow-verification','homepage-discovery-parity','homepage-shared-parity','homepage-hero-parity','homepage-writing-parity','homepage-assembly-parity','homepage-group1-parity']);
            for(const run of runs){
              const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id,per_page:100})).data.jobs;
              const artifacts=(await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:run.id,per_page:100})).data.artifacts;
              record.runs.push({id:run.id,path:run.path,name:run.name,head:run.head_sha,status:run.status,conclusion:run.conclusion,attempt:run.run_attempt,url:run.html_url,jobs:jobs.map(j=>({id:j.id,name:j.name,conclusion:j.conclusion,startedAt:j.started_at,completedAt:j.completed_at,steps:j.steps})),artifacts:artifacts.map(a=>({id:a.id,name:a.name,digest:a.digest,bytes:a.size_in_bytes,expiresAt:a.expires_at}))});
              for(const artifact of artifacts.filter(a=>wanted.has(a.name))){
                const response=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:artifact.id,archive_format:'zip'});
                const body=Buffer.from(response.data);assert.equal('sha256:'+hash(body),artifact.digest);
                const archive=path.join(out,artifact.name+'.zip');fs.writeFileSync(archive,body);
                const directory=path.join(out,artifact.name);fs.mkdirSync(directory,{recursive:true});
                cp.execFileSync('python3',['-c',`import sys,zipfile,pathlib
            z=zipfile.ZipFile(sys.argv[1]); d=pathlib.Path(sys.argv[2]); keep={'enlarged-candidate-header-1440-0.png','enlarged-before-header-1440-0.png','enlarged-candidate-gifting-320-0.png','enlarged-before-gifting-320-0.png','enlarged-candidate-footer-320-0.png','enlarged-candidate-footer-320-1.png','enlarged-candidate-footer-320-2.png','enlarged-before-footer-320-0.png','enlarged-candidate-tabs-320-0.png','enlarged-before-tabs-320-0.png','enlarged-candidate-progression-320-0.png','enlarged-before-progression-320-0.png','enlarged-candidate-progression-481-0.png','enlarged-candidate-progression-721-0.png','enlarged-candidate-progression-768-0.png','normal-before-header-361-0.png','normal-candidate-header-361-0.png','normal-before-footer-1440-0.png','normal-candidate-footer-1440-0.png','normal-before-progression-820-0.png','normal-candidate-progression-820-0.png'}
            for n in z.namelist():
              if n.endswith('.json') or pathlib.Path(n).name in keep: (d/pathlib.Path(n).name).write_bytes(z.read(n))`,archive,directory]);
                const reportPath=path.join(directory,'report.json');
                if(fs.existsSync(reportPath)){const raw=fs.readFileSync(reportPath);record.reports.push({artifact:artifact.name,artifactId:artifact.id,archiveSha256:hash(body),reportSha256:hash(raw),bytes:raw.length});}
                fs.unlinkSync(archive);
              }
              if(run.conclusion==='failure')for(const job of jobs.filter(j=>j.conclusion==='failure')){const response=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:job.id});fs.writeFileSync(path.join(out,'failure-'+job.id+'.log'),String(response.data));}
            }
            fs.writeFileSync(path.join(out,'checks.json'),JSON.stringify(record,null,2));
            for(const file of required){const matching=runs.filter(r=>path.basename(r.path)===file);assert.equal(matching.length,1,file);assert.equal(matching[0].conclusion,'success',file);}
            const reflow=JSON.parse(fs.readFileSync(path.join(out,'p4-reflow-verification/report.json'),'utf8'));
            assert.equal(reflow.sourceCommit,source);assert.deepEqual(reflow.failures,[]);assert.equal(reflow.widths.length,20);
            const testRun=runs.find(r=>r.path.endsWith('/verify-p4-reflow.yml'));
            const artifacts=(await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:testRun.id,per_page:100})).data.artifacts;
            const build=artifacts.find(a=>a.name==='p4-reflow-source-preview');assert(build&&!build.expired);
            const response=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:build.id,archive_format:'zip'});const bytes=Buffer.from(response.data);assert.equal('sha256:'+hash(bytes),build.digest);
            const archive=path.join(out,'tested-build.zip');fs.writeFileSync(archive,bytes);
            cp.execFileSync('python3',['-c','import sys,zipfile,pathlib; z=zipfile.ZipFile(sys.argv[1]); assert all(not n.startswith("/") and ".." not in pathlib.PurePosixPath(n).parts for n in z.namelist()); z.extractall(sys.argv[2])',archive,path.join(out,'build')]);
            fs.writeFileSync(path.join(out,'build-identity.json'),JSON.stringify({sourceCommit:source,runId:testRun.id,artifactId:build.id,digest:build.digest},null,2));
            core.info('All 14 candidate verification workflows passed. Exact tested build retained; no publication yet.');
      - name: Stage a review-only Git tree and durable verification files
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto'),zlib=require('node:zlib'),assert=require('node:assert/strict');
            assert.equal(context.repo.owner,'Storileaf');assert.equal(context.repo.repo,'storileaf-homepage-preview');assert.equal(context.ref,'refs/heads/main');
            const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim(), hash=b=>crypto.createHash('sha256').update(b).digest('hex');
            const out=path.join(process.env.RUNNER_TEMP,'p4-review'),identity=JSON.parse(fs.readFileSync(path.join(out,'build-identity.json'),'utf8'));
            const head=(await github.rest.git.getRef({...context.repo,ref:'heads/main'})).data.object.sha;assert.equal(head,context.sha,'Refuse newer main');
            const parent=(await github.rest.git.getCommit({...context.repo,commit_sha:head})).data;
            const files=[];const walk=(folder,prefix='')=>{for(const ent of fs.readdirSync(folder,{withFileTypes:true})){const name=prefix+ent.name;assert(!ent.isSymbolicLink());if(ent.isDirectory())walk(path.join(folder,ent.name),name+'/');else files.push(name);}};
            walk(path.join(out,'build'));assert.equal(files.length,16);assert(files.includes('index.html'));assert.equal(files.filter(f=>f.startsWith('assets/')).length,2);
            const entries=[],sha256={};
            async function add(file,bytes){const blob=(await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'})).data;entries.push({path:file,mode:'100644',type:'blob',sha:blob.sha});}
            for(const file of files){const bytes=fs.readFileSync(path.join(out,'build',file));sha256[file]=hash(bytes);await add('react-review/'+file,bytes);}
            const existing=git('ls-tree','-r','--name-only','HEAD','--','react-review').split('\n');
            for(const file of existing)if(file!=='react-review/BUILD_PROVENANCE.json'&&!files.includes(file.slice('react-review/'.length)))entries.push({path:file,mode:'100644',type:'blob',sha:null});
            const provenance={purpose:'Founder-authorised separate review refresh for P4-01 through P4-04. Not root cutover or production release.',...identity,artifactDigest:identity.digest,preparedFrom:head,preparedAt:new Date().toISOString(),destination:'react-review/',protectedBaseline:'e9550069d91b5a9b48ade43fcfb0a71bbed2875b',sha256,limits:'The verified reflow snapshot is fixed. P4-05 spoken announcements, P4-06, pricing and wider browser/device coverage remain separate.'};
            await add('react-review/BUILD_PROVENANCE.json',Buffer.from(JSON.stringify(provenance,null,2)+'\n'));
            const checks=fs.readFileSync(path.join(out,'checks.json'));await add('qa/package-4/2026-10-20/reflow/checks.json',checks);
            for(const directory of fs.readdirSync(out,{withFileTypes:true}).filter(e=>e.isDirectory()&&e.name.endsWith('-parity')||e.isDirectory()&&e.name==='p4-reflow-verification')){
              for(const file of fs.readdirSync(path.join(out,directory.name))){const bytes=fs.readFileSync(path.join(out,directory.name,file));
                if(file.endsWith('.json'))await add('qa/package-4/2026-10-20/reflow/'+directory.name+'-'+file+'.gz',zlib.gzipSync(bytes,{level:9}));
                else if(file.endsWith('.png'))await add('qa/package-4/2026-10-20/reflow/images/'+file,bytes);
              }
            }
            assert(entries.every(e=>e.path.startsWith('react-review/')||e.path.startsWith('qa/package-4/2026-10-20/reflow/')));
            const tree=(await github.rest.git.createTree({...context.repo,base_tree:parent.tree.sha,tree:entries})).data;
            const before=(await github.rest.git.getTree({...context.repo,tree_sha:parent.tree.sha})).data.tree,after=(await github.rest.git.getTree({...context.repo,tree_sha:tree.sha})).data.tree;
            for(const entry of before.filter(e=>!['react-review','qa'].includes(e.path)))assert.deepEqual(after.find(e=>e.path===entry.path),entry);
            const commit=(await github.rest.git.createCommit({...context.repo,message:'preview: refresh separate review with verified P4 reflow and durable evidence',tree:tree.sha,parents:[head]})).data;
            const result={candidateCommit:commit.sha,parentCommit:head,tree:tree.sha,sourceCommit:identity.sourceCommit,files:entries.map(e=>e.path),status:'Unreferenced candidate. Inspect rendered evidence and advance through the connected GitHub app only. Root and pricing unchanged.'};
            fs.writeFileSync(path.join(out,'staged.json'),JSON.stringify(result,null,2));core.info('P4_REVIEW_CANDIDATE '+JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-review-candidate
          path: ${{ runner.temp }}/p4-review/
          if-no-files-found: error
