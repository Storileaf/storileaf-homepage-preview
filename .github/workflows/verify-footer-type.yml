name: Verify final footer typography
on:
  push:
    branches: [main]
    paths:
      - assets/index-DhPZyX4z.css
      - frontend/**
      - scripts/footer-type/**
      - docs/FOOTER_TYPE_REVIEW.md
      - .github/workflows/verify-footer-type.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and protected published files
        run: cd frontend && npm ci --no-audit --no-fund && npm run check && npm run build
      - name: Serve the committed homepage and isolated source
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          mkdir -p /tmp/footer/storileaf-homepage-preview
          cp -a index.html 404.html assets covers gallery pricing /tmp/footer/storileaf-homepage-preview/
          python3 -m http.server 4173 --directory /tmp/footer > /tmp/footer-static.log 2>&1 &
          python3 -m http.server 4180 --directory frontend/dist > /tmp/footer-source.log 2>&1 &
          sleep 2
      - name: Compare the approved footer correction at nine widths
        run: node scripts/footer-type/verify.mjs
      - name: Verify the actual deployed homepage without injected styles
        run: node scripts/footer-type/verify.mjs --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footer-type-published-review
          path: |
            qa/footer-type/
            qa/footer-type-live/
