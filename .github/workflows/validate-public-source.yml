name: Validate editable StoriLeaf public website source

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/validate-public-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Check React types, approved content, static release guard and component foundations
        working-directory: frontend
        run: npm run check
      - name: Build isolated source preview
        working-directory: frontend
        run: npm run build
      - name: Retain dependency lockfile after initial bootstrap
        run: |
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Lock public frontend dependencies [skip ci]"
            git push origin HEAD:main
          fi
      - name: Attach source-driven preview for design review
        uses: actions/upload-artifact@v4
        with:
          name: public-frontend-source-preview
          path: frontend/dist/
          if-no-files-found: error
