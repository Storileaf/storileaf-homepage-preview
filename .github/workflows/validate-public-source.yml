name: Validate editable StoriLeaf public website source

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/validate-public-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check React types, approved content, static release guard and component foundations
        working-directory: frontend
        run: npm run check
      - name: Build isolated source preview
        working-directory: frontend
        run: npm run build
      - name: Attach source-driven preview for design review
        uses: actions/upload-artifact@v4
        with:
          name: public-frontend-source-preview
          path: frontend/dist/
          if-no-files-found: error
