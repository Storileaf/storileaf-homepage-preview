name: Review published Package 1
on:
  push:
    paths:
      - '.github/workflows/review-published-package1.yml'
      - 'scripts/package1-published/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    if: github.repository == 'Storileaf/storileaf-homepage-preview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare only the approved stylesheet substitutions
        run: |
          node scripts/package1-published/prepare.mjs
          git diff -- assets/index-DhPZyX4z.css > qa/package1-published/changes.diff
      - name: Install isolated browser test dependency
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Serve the candidate static homepage
        run: |
          mkdir -p /tmp/storileaf-qa/storileaf-homepage-preview
          cp -a index.html 404.html assets covers gallery pricing /tmp/storileaf-qa/storileaf-homepage-preview/
          python3 -m http.server 4173 --directory /tmp/storileaf-qa > /tmp/storileaf-qa.log 2>&1 &
          sleep 2
      - name: Run existing homepage interaction regression
        run: node scripts/verify-homepage-ui.mjs
      - name: Compare nine widths and verify approved Package 1 changes
        run: node scripts/package1-published/verify.mjs
      - name: Store verified stylesheet as an unattached blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          f='assets/index-DhPZyX4z.css'
          payload=json.dumps({'content':Path(f).read_text(),'encoding':'utf-8'})
          result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/Storileaf/storileaf-homepage-preview/git/blobs','--input','-'],input=payload,text=True))
          Path('qa/package1-published/verified-blob.json').write_text(json.dumps({'path':f,'sha':result['sha']})+'\n')
          print('Verified unattached CSS blob',result['sha'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-package1-review
          path: |
            qa/package1-published/
            qa/homepage-qa-report.json
            qa/screenshots/
          if-no-files-found: error
