name: Review published Package 1
on:
  push:
    paths:
      - 'assets/**'
      - '.github/workflows/review-published-package1.yml'
      - 'scripts/package1-published/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'Storileaf/storileaf-homepage-preview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Serve the exact committed static homepage
        run: |
          mkdir -p /tmp/storileaf-qa/storileaf-homepage-preview
          cp -a index.html 404.html assets covers gallery pricing /tmp/storileaf-qa/storileaf-homepage-preview/
          python3 -m http.server 4173 --directory /tmp/storileaf-qa > /tmp/storileaf-qa.log 2>&1 &
          sleep 2
      - name: Compare nine widths and verify published Package 1
        run: node scripts/package1-published/verify.mjs
      - name: Wait for Pages and inspect the actual live homepage
        run: node scripts/package1-published/live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-package1-review
          path: |
            qa/package1-published/
            qa/package1-live/
          if-no-files-found: error
