name: Review published Package 1
on:
  push:
    paths:
      - '.github/workflows/review-published-package1.yml'
      - 'scripts/package1-published/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    if: github.repository == 'Storileaf/storileaf-homepage-preview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare only the approved stylesheet substitutions
        run: |
          node scripts/package1-published/prepare.mjs
          git diff -- assets/index-DhPZyX4z.css > qa/package1-published/changes.diff
      - name: Install isolated browser test dependency
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Serve the candidate static homepage
        run: |
          mkdir -p /tmp/storileaf-qa/storileaf-homepage-preview
          cp -a index.html 404.html assets covers gallery pricing /tmp/storileaf-qa/storileaf-homepage-preview/
          python3 -m http.server 4173 --directory /tmp/storileaf-qa > /tmp/storileaf-qa.log 2>&1 &
          sleep 2
      - name: Run existing homepage interaction regression
        run: node scripts/verify-homepage-ui.mjs
      - name: Compare nine widths and verify approved Package 1 changes
        run: node scripts/package1-published/verify.mjs
      - name: Store reviewed files as unattached blobs without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          files={'assets/index-DhPZyX4z.css':Path('assets/index-DhPZyX4z.css').read_text()}
          audit_path='frontend/scripts/verify-shape-foundation.mjs'
          audit=Path(audit_path).read_text()
          for old,new in [("measured['.header-find-book']?.radius === '9px'","measured['.header-find-book']?.radius === '6px'"),("measured['.newsletter-inline-preview input']?.radius === '9px'","measured['.newsletter-inline-preview input']?.radius === '6px'")]:
            assert audit.count(old)==1,old
            audit=audit.replace(old,new)
          audit=audit.replace('existing primary/gold hover colours; source only','existing primary/gold hover colours; source and published controls')
          files[audit_path]=audit
          results=[]
          for f,content in files.items():
            result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/Storileaf/storileaf-homepage-preview/git/blobs','--input','-'],input=json.dumps({'content':content,'encoding':'utf-8'}),text=True))
            results.append({'path':f,'sha':result['sha']})
          Path('qa/package1-published/verified-blobs.json').write_text(json.dumps(results)+'\n')
          print('Verified unattached files',json.dumps(results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-package1-review
          path: |
            qa/package1-published/
            qa/homepage-qa-report.json
            qa/screenshots/
          if-no-files-found: error
