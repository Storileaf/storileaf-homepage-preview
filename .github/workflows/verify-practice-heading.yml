name: Verify P4 practice heading zoom and spacing
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-practice-heading.yml
      - scripts/p4-practice-heading/**
      - frontend/src/styles/homepage-reflow.css
      - frontend/src/styles/writing.css
      - frontend/src/sections/PracticeDialog.tsx
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current source and protect the published original
        run: cd frontend && npm ci --no-audit --no-fund && npm run check && npm run build
      - name: Retain the original diagnostic input at its verified identity
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process'),assert=require('node:assert/strict');
            const response=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:12308507130,archive_format:'zip'});
            const bytes=Buffer.from(response.data);assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),'c74b3f8ae1c3b32ed5740fed7e0260ebc01ea5a7c04f00452ac9d029b7a1413d');
            const archive=process.env.RUNNER_TEMP+'/p406-before.zip';fs.writeFileSync(archive,bytes);
            cp.execFileSync('python3',['-c','import zipfile,sys,pathlib; z=zipfile.ZipFile(sys.argv[1]); assert all(not n.startswith("/") and ".." not in pathlib.PurePosixPath(n).parts for n in z.namelist()); z.extractall("qa/practice-heading/before")',archive]);
      - name: Prepare the native browser display
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          command -v Xvfb
          python3 -c "import ctypes; ctypes.CDLL('libX11.so.6'); ctypes.CDLL('libXtst.so.6')"
          mkdir -p qa/practice-heading
          Xvfb :99 -screen 0 3600x2400x24 > "$RUNNER_TEMP/p406-display.log" 2>&1 &
          python3 -m http.server 4180 --bind 127.0.0.1 --directory frontend/dist > "$RUNNER_TEMP/p406-server.log" 2>&1 &
          sleep 2
      - name: Verify native zoom, all spacing combinations and ordinary parity
        env:
          DISPLAY: ':99'
        run: node scripts/p4-practice-heading/check.mjs
      - name: Retain original reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-heading-zoom-spacing
          path: qa/practice-heading/
          if-no-files-found: error
      - name: Retain the exact candidate build without publication
        uses: actions/upload-artifact@v4
        with:
          name: practice-heading-verified-build
          path: frontend/dist/
          if-no-files-found: error
