name: Prepare bounded P4 verification update
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-p4-completion.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve runtime and protected original
        run: |
          node frontend/scripts/guard-published.mjs
          test "$(git rev-parse HEAD:frontend)" = "$(git rev-parse 9bf877954e1b4fc6091b93e79de67f0ec6394eab:frontend)"
          mkdir -p qa/p406-contract
      - name: Load the inspected native capture helper
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict');
            const file='scripts/p4-practice-heading/native-capture.py',sha='41dd4071abb0a9f589a91f88b4fce487bc88cea0';assert(!fs.existsSync(file));
            const blob=(await github.rest.git.getBlob({...context.repo,file_sha:sha})).data;assert.equal(blob.encoding,'base64');fs.writeFileSync(file,Buffer.from(blob.content,'base64'));assert.equal(cp.execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim(),sha);
      - name: Use native-window capture without changing page rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('scripts/p4-practice-heading/verify.mjs');b=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='8c21da27aa741a33a8cbaf530f00e82f18b07c80'
          s=b.decode()
          def replace(a,b):
              global s
              assert s.count(a)==1,a[:100]
              s=s.replace(a,b)
          helper='''async function screenshot(p, file) {
            if (p.viewportSize() !== null) return p.screenshot({path:file})
            await p.bringToFront();await frames(p);await p.waitForTimeout(100)
            const observed={viewport:await viewport(p),heading:await p.locator('.sl-practice-dialog h2').boundingBox()}
            const metadata=JSON.parse(execFileSync('python3',['scripts/p4-practice-heading/native-capture.py',file,JSON.stringify(observed)],{encoding:'utf8'}))
            report.nativeCaptures ||= [];report.nativeCaptures.push({file:path.basename(file),...metadata})
          }
          '''
          replace('async function observe(p,label,meta={},stress=false){',helper+'async function observe(p,label,meta={},stress=false){')
          replace("await p.screenshot({path:out+'/'+image})","await screenshot(p,out+'/'+image)")
          replace("await p.screenshot({path:out+'/'+bottom})","await screenshot(p,out+'/'+bottom)")
          replace("const out='qa/practice-heading', url='http://127.0.0.1:4180/'","const out='qa/practice-heading', url='http://127.0.0.1:4180/'\n// Native images use X11 window pixels with a fixed 100ms presentation interval.\n// CDP zoom screenshots previously returned a uniform background and are not visual evidence.")
          p.write_text(s)
          PY
          python3 -m py_compile scripts/p4-practice-heading/native-capture.py
          node --check scripts/p4-practice-heading/verify.mjs
          git add scripts/p4-practice-heading/native-capture.py scripts/p4-practice-heading/verify.mjs
          git diff --cached --check
          git diff --cached > qa/p406-contract/candidate.patch
      - name: Prepare a commit for connected-app inspection without advancing main
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict');
            const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();assert.equal((await github.rest.git.getRef({...context.repo,ref:'heads/main'})).data.object.sha,context.sha);
            const files=['scripts/p4-practice-heading/native-capture.py','scripts/p4-practice-heading/verify.mjs'];assert.deepEqual(git('diff','--cached','--name-only').split('\n').sort(),[...files].sort());
            const entries=[];for(const file of files){const blob=(await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(file,'utf8'),encoding:'utf-8'})).data;entries.push({path:file,mode:'100644',type:'blob',sha:blob.sha});}
            const tree=(await github.rest.git.createTree({...context.repo,base_tree:git('rev-parse','HEAD^{tree}'),tree:entries})).data;
            const commit=(await github.rest.git.createCommit({...context.repo,message:'test: retain real native zoom window images and reject blank rendering evidence',tree:tree.sha,parents:[context.sha]})).data;
            const result={parent:context.sha,commit:commit.sha,tree:tree.sha,files:entries,runtimeSource:'78d15276578b671cc072ab51032b7c67375f7b40',scope:'Native screenshot harness only. Frontend and all published files remain unchanged. No branch reference advanced.'};fs.writeFileSync('qa/p406-contract/candidate.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p406-native-capture-candidate
          path: qa/p406-contract/
          if-no-files-found: error
