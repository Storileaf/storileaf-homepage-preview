      - name: Create a closure tree for connected-app inspection without publishing
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto'),assert=require('node:assert/strict');
            const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
            const head=(await github.rest.git.getRef({...context.repo,ref:'heads/main'})).data.object.sha;assert.equal(head,context.sha);
            const out=process.env.P4_CLOSE,files=JSON.parse(fs.readFileSync(path.join(out,'prepared-files.json'),'utf8')),entries=[];
            for(const [file,expected] of Object.entries(files)){
              assert(file.startsWith('docs/')||file==='REPOSITORY_HANDOFF.md'||file==='.github/workflows/verify-react-review.yml'||file.startsWith('qa/package-4/2026-10-20/'));
              const bytes=fs.readFileSync(path.join(out,'prepared',file));assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),expected);
              const blob=(await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'})).data;entries.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
            }
            // Preserve this later preparation record while adopting only the already verified review tree.
            const workflow='.github/workflows/prepare-p4-completion.yml';entries.push({path:workflow,mode:'100644',type:'blob',sha:git('rev-parse','HEAD:'+workflow)});
            const tree=(await github.rest.git.createTree({...context.repo,base_tree:'7f5d52a2c6d3b5cd6b547a6d76a1d4627448728c',tree:entries})).data;
            const current=(await github.rest.git.getTree({...context.repo,tree_sha:git('rev-parse','HEAD^{tree}')})).data.tree;
            const candidate=(await github.rest.git.getTree({...context.repo,tree_sha:tree.sha})).data.tree;
            for(const item of current.filter(e=>!['docs','qa','react-review','.github','REPOSITORY_HANDOFF.md'].includes(e.path)))assert.deepEqual(candidate.find(e=>e.path===item.path),item);
            const result={tree:tree.sha,parentCommit:head,sourceCommit:'dbfac4a24b1fc16e1d440ac499012a76b27ab0c9',verifiedReviewTree:'7f5d52a2c6d3b5cd6b547a6d76a1d4627448728c',files,scope:'Documentation, evidence, live verification identity and exact separate review only. No branch reference advanced. Root and private production unchanged.'};
            fs.writeFileSync(path.join(out,'closure-tree.json'),JSON.stringify(result,null,2));core.info('P4_CLOSURE_TREE '+JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-closure-records
          path: |
            ${{ runner.temp }}/p4-close/closure-tree.json
            ${{ runner.temp }}/p4-close/prepared-files.json
            ${{ runner.temp }}/p4-close/prepared/
          if-no-files-found: warn
