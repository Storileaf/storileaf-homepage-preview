name: Prepare inspected P4 reflow correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-p4-completion.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only the inspected discovery correction in the runner
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'), cp=require('node:child_process'), assert=require('node:assert/strict'), crypto=require('node:crypto');
            assert.equal(context.repo.owner,'Storileaf');assert.equal(context.repo.repo,'storileaf-homepage-preview');assert.equal(context.ref,'refs/heads/main');
            const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
            assert.equal(git('rev-parse','HEAD:frontend'),git('rev-parse','5094e6cc9f7cad145997344635a207c1c741a759:frontend'));
            const replace=(file,from,to)=>{const text=fs.readFileSync(file,'utf8');assert.equal(text.split(from).length,2,file+' exact single replacement');fs.writeFileSync(file,text.replace(from,to));};
            const hook=`import { useLayoutEffect, useRef } from 'react'
            import { observeIntrinsicFit } from '../intrinsicTextFit'

            /** Keep the selected tab visible after text changes its intrinsic width.
             * Selection, keyboard handling and vertical page position are untouched. */
            export function useDiscoveryTextFit() {
              const ref = useRef<HTMLDivElement>(null)
              useLayoutEffect(() => {
                const rail = ref.current
                if (!rail) return
                const tabs = [...rail.querySelectorAll<HTMLElement>('[role="tab"]')]
                let previous = ''
                const measure = () => {
                  const sizes = [rail.clientWidth, ...tabs.map(tab => tab.getBoundingClientRect().width)].join(',')
                  const changed = previous !== '' && sizes !== previous
                  previous = sizes
                  if (!changed) return
                  const active = tabs.find(tab => tab.getAttribute('aria-selected') === 'true')
                  if (!active) return
                  const outer = rail.getBoundingClientRect(), inner = active.getBoundingClientRect()
                  const delta = inner.left < outer.left ? inner.left - outer.left
                    : inner.right > outer.right ? inner.right - outer.right : 0
                  if (Math.abs(delta) > .5) rail.scrollBy({ left: delta, behavior: 'instant' })
                }
                return observeIntrinsicFit([rail, ...tabs], measure)
              }, [])
              return ref
            }
            `;
            assert(!fs.existsSync('frontend/src/sections/useDiscoveryTextFit.ts'));
            fs.writeFileSync('frontend/src/sections/useDiscoveryTextFit.ts',hook);
            replace('frontend/src/sections/BookDiscovery.tsx',"import { useEffect, useRef, useState } from 'react'","import { useEffect, useState } from 'react'\nimport { useDiscoveryTextFit } from './useDiscoveryTextFit'");
            replace('frontend/src/sections/BookDiscovery.tsx','const tabRail = useRef<HTMLDivElement>(null)','const tabRail = useDiscoveryTextFit()');
            fs.appendFileSync('frontend/scripts/reflow-contract.mjs',String.raw`
            /** The underline keeps its exact insets and tracks the authorised tab width. */
            export function discoveryUnderlineWidthEquivalent(name, before, after) {
              if (!/^tab[0-5]$/.test(name)) return false
              const values = [before?.geometry?.width, after?.geometry?.width]
              for (const node of [before, after]) {
                const dimensions = ['width', 'left', 'right'].map(key => /^-?[\d.]+px$/.test(node?.pseudo?.[key]) ? parseFloat(node.pseudo[key]) : NaN)
                values.push(...dimensions)
                if (!dimensions.every(Number.isFinite) || Math.abs(dimensions[0] - (node.geometry.width - dimensions[1] - dimensions[2])) > .15) return false
              }
              return values.every(Number.isFinite) && before.pseudo.left === after.pseudo.left && before.pseudo.right === after.pseudo.right
            }
            `);
            fs.appendFileSync('frontend/scripts/reflow-contract.test.mjs',`

            test('discovery underline width must follow its own tab with unchanged insets', async () => {
              const { discoveryUnderlineWidthEquivalent } = await import('./reflow-contract.mjs')
              const before = { geometry: { width: 147 }, pseudo: { width: '125px', left: '11px', right: '11px' } }
              const after = { geometry: { width: 216.563 }, pseudo: { width: '194.562px', left: '11px', right: '11px' } }
              assert.equal(discoveryUnderlineWidthEquivalent('tab2', before, after), true)
              assert.equal(discoveryUnderlineWidthEquivalent('photo', before, after), false)
              assert.equal(discoveryUnderlineWidthEquivalent('tab2', before, { ...after, pseudo: { ...after.pseudo, width: '190px' } }), false)
              assert.equal(discoveryUnderlineWidthEquivalent('tab2', before, { ...after, pseudo: { ...after.pseudo, left: '12px' } }), false)
              assert.equal(discoveryUnderlineWidthEquivalent('tab2', before, null), false)
            })
            `);
            replace('frontend/scripts/verify-discovery-parity.mjs','import { tabMinimumEquivalent, cleanQuality, discoveryReflowDimension }','import { tabMinimumEquivalent, cleanQuality, discoveryReflowDimension, discoveryUnderlineWidthEquivalent }');
            replace('frontend/scripts/verify-discovery-parity.mjs',"if (b.pseudo && a.pseudo) for (const key of pseudoStyles) if (normalStyle(key, b.pseudo[key], b.pseudo) !== normalStyle(key, a.pseudo[key], a.pseudo)) differences.push(name + ' pseudo ' + key + ' differs')",`if (b.pseudo && a.pseudo) for (const key of pseudoStyles) {
                  if (enlarged && key === 'width' && discoveryUnderlineWidthEquivalent(name, b, a)) continue
                  if (normalStyle(key, b.pseudo[key], b.pseudo) !== normalStyle(key, a.pseudo[key], a.pseudo)) differences.push(name + ' pseudo ' + key + ' differs')
                }`);
            replace('frontend/scripts/verify-discovery-parity.mjs',"    check(JSON.stringify(values.published.quality) === JSON.stringify(values.source.quality), 'Enlarged discovery quality differs ' + viewport.width + ' ' + slug)","    // Retain the baseline measurements; the authorised source must eliminate clipping rather than reproduce it.");
            const expected={
              'frontend/src/sections/useDiscoveryTextFit.ts':'8ef8b7c7109d8d83c2adbe905e6268d0ad9213dd4e0198093c8a8f0d461d0473',
              'frontend/src/sections/BookDiscovery.tsx':'352f712303cc3fd51a421fa2cb87238cf1fdf1f1430f11768d0e8e250d224f9c',
              'frontend/scripts/reflow-contract.mjs':'b420b56364a49dc92378c7dcc3bd22b0ffebae45b0597eac03a6e352beae00de',
              'frontend/scripts/reflow-contract.test.mjs':'b05c871393959b625676baf8c736a3d4c20cb30d9c4b9f9e23914436bb3c9d41',
              'frontend/scripts/verify-discovery-parity.mjs':'7fb57bd7710c1b293f02ce2adb30c1ae15a8f5817c35191efcae07c55ad4f1f7'
            };
            for(const [file,expectedHash] of Object.entries(expected))assert.equal(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),expectedHash,file);
            cp.execFileSync('git',['add','--',...Object.keys(expected)]);cp.execFileSync('git',['diff','--cached','--check']);
      - name: Validate types, content, protected files, regression tests and build
        run: cd frontend && npm ci --no-audit --no-fund && npm run check && npm run build
      - name: Create an unreferenced source candidate without advancing main
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),assert=require('node:assert/strict');
            const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
            const head=(await github.rest.git.getRef({...context.repo,ref:'heads/main'})).data.object.sha;assert.equal(head,context.sha);
            const parent=(await github.rest.git.getCommit({...context.repo,commit_sha:head})).data;
            const files=git('diff','--cached','--name-only').split('\n');assert.equal(files.length,5);
            const entries=[];
            for(const file of files){assert(file.startsWith('frontend/'));const blob=(await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(file,'utf8'),encoding:'utf-8'})).data;assert.equal(blob.sha,git('rev-parse',':'+file));entries.push({path:file,mode:'100644',type:'blob',sha:blob.sha});}
            const tree=(await github.rest.git.createTree({...context.repo,base_tree:parent.tree.sha,tree:entries})).data;
            const commit=(await github.rest.git.createCommit({...context.repo,message:'fix: retain selected discovery tab during enlarged text reflow',tree:tree.sha,parents:[head]})).data;
            const result={candidateCommit:commit.sha,parentCommit:head,tree:tree.sha,files,status:'Source validation passed. Browser checks and review refresh pending. Main not advanced.'};
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'p4-staged.json'),JSON.stringify(result,null,2));core.info('P4_CANDIDATE '+JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-inspected-candidate
          path: ${{ runner.temp }}/p4-staged.json
          if-no-files-found: warn
