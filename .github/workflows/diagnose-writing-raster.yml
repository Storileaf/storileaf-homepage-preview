name: Diagnose native writing device raster

on:
  push:
    branches: [main]
    paths:
      - 'qa/homepage-assembly/2026-10-20/diagnose-writing-raster.mjs'
      - '.github/workflows/diagnose-writing-raster.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        raster_mode: [default, disable-lcd-text]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen source and build the isolated preview
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run check && npm run build
      - name: Install isolated diagnostic browser harness
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Serve protected baseline and unpublished source
        run: |
          mkdir -p "$RUNNER_TEMP/writing-raster-baseline/storileaf-homepage-preview"
          cp -a index.html 404.html assets covers gallery pricing "$RUNNER_TEMP/writing-raster-baseline/storileaf-homepage-preview/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/writing-raster-baseline" > "$RUNNER_TEMP/writing-raster-baseline.log" 2>&1 &
          python3 -m http.server 4180 --bind 127.0.0.1 --directory frontend/dist > "$RUNNER_TEMP/writing-raster-source.log" 2>&1 &
          sleep 2
      - name: Record fixed native stages and read-only compositor evidence
        env:
          WRITING_RASTER_OUT: ${{ runner.temp }}/writing-raster-diagnostic
          WRITING_RASTER_MODE: ${{ matrix.raster_mode }}
        run: node qa/homepage-assembly/2026-10-20/diagnose-writing-raster.mjs
      - name: Confirm protected runtime
        if: always()
        working-directory: frontend
        run: npm run guard:published
      - name: Attach diagnostic evidence, not a parity checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-writing-raster-diagnostic-${{ matrix.raster_mode }}
          path: ${{ runner.temp }}/writing-raster-diagnostic/
          if-no-files-found: error
