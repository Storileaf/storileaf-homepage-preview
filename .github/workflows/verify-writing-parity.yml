name: Verify React writing showcase and practice parity

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/verify-writing-parity.yml'
  workflow_dispatch:
    inputs:
      focused:
        description: Run the development subset only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and preserve the published runtime
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run check && npm run build
      - name: Install isolated browser harness
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Install and record exact Chrome for Testing
        env:
          CHROME_PINNED_VERSION: '155.0.8059.84'
          CHROME_PINNED_REVISION: '1697595'
          CHROME_ARCHIVE_URL: https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.84/linux64/chrome-linux64.zip
        run: |
          export CHROME_ARCHIVE_PATH="$RUNNER_TEMP/chrome-for-testing-$CHROME_PINNED_VERSION-linux64.zip"
          export CHROME_PATH="$RUNNER_TEMP/chrome-for-testing-$CHROME_PINNED_VERSION/chrome-linux64/chrome"
          curl --fail --location --silent --show-error "$CHROME_ARCHIVE_URL" --output "$CHROME_ARCHIVE_PATH"
          mkdir -p "$RUNNER_TEMP/chrome-for-testing-$CHROME_PINNED_VERSION" frontend/qa/writing
          unzip -q "$CHROME_ARCHIVE_PATH" -d "$RUNNER_TEMP/chrome-for-testing-$CHROME_PINNED_VERSION"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { readFileSync, realpathSync, statSync, writeFileSync } from 'node:fs'
          import { release } from 'node:os'
          const command = (name, args) => execFileSync(name, args, { encoding: 'utf8' }).trim()
          const sha256 = path => command('sha256sum', [path]).split(/\s+/)[0]
          const binary = realpathSync(process.env.CHROME_PATH)
          const versionOutput = command(binary, ['--version'])
          const actualVersion = versionOutput.match(/\b\d+\.\d+\.\d+\.\d+\b/)?.[0]
          const metadata = {
            purpose: 'Exact browser provenance for the unchanged Writing checkpoint; default rendering with no LCD flag.',
            recordedAt: new Date().toISOString(),
            browser: {
              expectedVersion: process.env.CHROME_PINNED_VERSION,
              expectedRevision: process.env.CHROME_PINNED_REVISION,
              actualVersion, versionOutput,
              archive: { url: process.env.CHROME_ARCHIVE_URL, bytes: statSync(process.env.CHROME_ARCHIVE_PATH).size, sha256: sha256(process.env.CHROME_ARCHIVE_PATH) },
              executable: { path: binary, bytes: statSync(binary).size, sha256: sha256(binary) },
              checkpointLaunch: { headless: true, args: ['--no-sandbox'] }
            },
            runner: {
              name: process.env.RUNNER_NAME, os: process.env.RUNNER_OS, arch: process.env.RUNNER_ARCH,
              imageOS: process.env.ImageOS, imageVersion: process.env.ImageVersion,
              kernel: release(), osRelease: readFileSync('/etc/os-release', 'utf8')
            },
            runtime: {
              node: process.version, npm: command('npm', ['--version']),
              python: command('python3', ['--version']),
              playwright: JSON.parse(readFileSync('node_modules/playwright-core/package.json', 'utf8')).version
            },
            run: {
              repository: process.env.GITHUB_REPOSITORY, id: process.env.GITHUB_RUN_ID,
              attempt: process.env.GITHUB_RUN_ATTEMPT, job: process.env.GITHUB_JOB, commit: process.env.GITHUB_SHA
            },
            runtimeTree: command('git', ['rev-parse', 'HEAD:frontend']),
            harness: { path: 'frontend/scripts/verify-writing-parity.mjs', sha256: sha256('frontend/scripts/verify-writing-parity.mjs') },
            workflow: { path: '.github/workflows/verify-writing-parity.yml', sha256: sha256('.github/workflows/verify-writing-parity.yml') }
          }
          writeFileSync('frontend/qa/writing/browser-environment.json', JSON.stringify(metadata, null, 2) + '\n')
          assert.equal(actualVersion, process.env.CHROME_PINNED_VERSION, 'The checkpoint must use its exact pinned Chrome version')
          console.log(`Recorded Chrome for Testing ${actualVersion} and its archive/executable SHA256s`)
          NODE
          printf 'CHROME_PATH=%s\n' "$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Serve baseline and source
        run: |
          mkdir -p "$RUNNER_TEMP/writing-baseline/storileaf-homepage-preview"
          cp -a index.html 404.html assets covers gallery pricing "$RUNNER_TEMP/writing-baseline/storileaf-homepage-preview/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/writing-baseline" > "$RUNNER_TEMP/writing-baseline.log" 2>&1 &
          python3 -m http.server 4180 --bind 127.0.0.1 --directory frontend/dist > "$RUNNER_TEMP/writing-source.log" 2>&1 &
          sleep 2
      - name: Compare writing composition and unsaved practice behaviour
        working-directory: frontend
        env:
          WRITING_FOCUSED: ${{ inputs.focused && '1' || '0' }}
          WRITING_WIDTHS: ${{ inputs.focused && '320,390,820,1440' || '' }}
        run: node scripts/verify-writing-parity.mjs
      - name: Confirm protected runtime
        if: always()
        working-directory: frontend
        run: npm run guard:published
      - name: Attach rendered writing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-writing-parity
          path: frontend/qa/writing/
          if-no-files-found: warn
      - name: Attach isolated preview
        uses: actions/upload-artifact@v4
        with:
          name: homepage-writing-source-preview
          path: frontend/dist/
          if-no-files-found: error
