name: Verify editorial link sizing
on:
  push:
    paths:
      - '.github/workflows/review-editorial-links.yml'
      - 'scripts/editorial-links/**'
      - 'assets/index-DhPZyX4z.css'
      - 'frontend/src/styles/**'
      - 'frontend/scripts/guard-published.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current source and protected release
        run: cd frontend && npm ci --no-audit --no-fund && npm run check && npm run build
      - name: Serve exact committed homepage and isolated source
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          mkdir -p /tmp/editorial/storileaf-homepage-preview
          cp -a index.html 404.html assets covers gallery pricing /tmp/editorial/storileaf-homepage-preview/
          python3 -m http.server 4173 --directory /tmp/editorial > /tmp/editorial-static.log 2>&1 &
          python3 -m http.server 4180 --directory frontend/dist > /tmp/editorial-source.log 2>&1 &
          sleep 2
      - name: Compare editorial links and verify untouched controls and footer
        run: node scripts/editorial-links/verify.mjs
      - name: Wait for and inspect actual deployed Pages without stylesheet injection
        run: node scripts/editorial-links/verify.mjs --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-link-published-review
          path: |
            qa/editorial-links/
            qa/editorial-links-live/
          if-no-files-found: warn
